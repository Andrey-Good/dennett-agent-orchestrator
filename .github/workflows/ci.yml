name: Dennett CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-deps-fast:
    name: Docs, deps, fast & self-check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux Tauri 2 system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            pkg-config

      - name: Install Rust toolchain (matches rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (2026-11-15)
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: nextest@0.9.152

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: "10.33.0"

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install desktop frontend dependencies (frozen lockfile)
        run: pnpm --dir apps/desktop install --frozen-lockfile

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.23"
          enable-cache: false

      - name: Sync runner environment
        run: uv sync --project ops/runner --frozen

      - name: Check documentation and links
        run: uv run --project ops/runner dennett-check docs

      - name: Check locked dependencies and boundaries
        run: uv run --project ops/runner dennett-check deps

      - name: Run desktop frontend checks, formatting, clippy, rustdoc, doctests, and fast unit/safety suite
        run: uv run --project ops/runner dennett-check fast

      - name: Build production Tauri desktop binary (--features custom-protocol)
        run: cargo build -p dennett-desktop --features custom-protocol

      - name: Run test-harness self-check
        run: uv run --project ops/runner dennett-check self-check

  postgres-integration:
    name: PostgreSQL, memoryd, Head & Desktop V03 integration (Ubuntu --manage-pg)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux Tauri 2 system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            pkg-config

      - name: Install Rust toolchain (matches rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (2026-11-15)
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: nextest@0.9.152

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.23"
          enable-cache: false

      - name: Sync runner environment
        run: uv sync --project ops/runner --frozen

      - name: Run PostgreSQL, memoryd, Head, and Desktop V03 bridge integration tests via Docker Compose
        run: uv run --project ops/runner dennett-check integration --manage-pg

  windows-postgres-integration:
    name: PostgreSQL, memoryd, Head & Desktop V03 integration (Windows native PG)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain (matches rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (2026-11-15)
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: nextest@0.9.152

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.23"
          enable-cache: false

      - name: Sync runner environment
        run: uv sync --project ops/runner --frozen

      - name: Initialize isolated native PostgreSQL cluster on loopback
        shell: pwsh
        run: |
          $pgBin = Get-ChildItem "C:\Program Files\PostgreSQL" -Directory -ErrorAction SilentlyContinue |
            Sort-Object { [int]($_.Name -replace '[^0-9]', '') } -Descending |
            ForEach-Object { Join-Path $_.FullName "bin" } |
            Where-Object { Test-Path (Join-Path $_ "pg_ctl.exe") } |
            Select-Object -First 1
          if (-not $pgBin) {
            throw "Pre-installed PostgreSQL binaries not found under C:\Program Files\PostgreSQL"
          }
          Write-Host "Using PostgreSQL bin: $pgBin"
          $pgData = Join-Path $env:RUNNER_TEMP "dennett-pg-test-data"
          $pgLog = Join-Path $env:RUNNER_TEMP "dennett-pg-test.log"
          if (Test-Path $pgData) { Remove-Item -Recurse -Force $pgData }
          & (Join-Path $pgBin "initdb.exe") -D $pgData -U dennett_bootstrap --auth=trust --encoding=UTF8 --no-locale
          if ($LASTEXITCODE -ne 0) { throw "initdb failed" }
          & (Join-Path $pgBin "pg_ctl.exe") -D $pgData -l $pgLog -o "-h 127.0.0.1 -p 15432" start
          if ($LASTEXITCODE -ne 0) { throw "pg_ctl start failed" }
          & (Join-Path $pgBin "psql.exe") -h 127.0.0.1 -p 15432 -U dennett_bootstrap -d postgres -v ON_ERROR_STOP=1 -f ops/test-env/init/01_init_roles_and_dbs.sql
          if ($LASTEXITCODE -ne 0) { throw "01_init_roles_and_dbs.sql failed" }
          "PG_BIN=$pgBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PG_DATA=$pgData" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DENNETT_TEST_MEMORY_PG_URL=postgres://dennett_memory_role:dennett_memory_test_pw@127.0.0.1:15432/dennett_memory_test" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DENNETT_TEST_CONTROL_PG_URL=postgres://dennett_control_role:dennett_control_test_pw@127.0.0.1:15432/dennett_control_test" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run PostgreSQL, memoryd, Head, Control MCP & Desktop V03 integration suite on Windows
        run: |
          uv run --project ops/runner dennett-check integration
          uv run --project ops/runner dennett-check demo-d2 --dry-run
          uv run --project ops/runner dennett-check demo-d3 --dry-run

      - name: Stop isolated native PostgreSQL cluster
        if: always()
        shell: pwsh
        run: |
          if ($env:PG_BIN -and $env:PG_DATA -and (Test-Path $env:PG_DATA)) {
            & (Join-Path $env:PG_BIN "pg_ctl.exe") -D $env:PG_DATA -m immediate stop
          }
