[workspace]
resolver = "3"
members = [
    "crates/dennett-contracts",
    "crates/dennett-memory-core",
    "crates/dennett-memory-client",
    "crates/dennett-head-client",
    "crates/dennett-testkit",
    "services/memoryd",
    "services/head",
    "adapters/memory-mcp",
    "adapters/control-mcp",
    "adapters/antigravity-acp",
    "adapters/local-runtime",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.dependencies]
axum = "0.8"
base64 = "0.22"
chacha20poly1305 = "0.10"
deadpool-postgres = "0.14"
dennett-contracts = { path = "crates/dennett-contracts" }
dennett-head-client = { path = "crates/dennett-head-client" }
dennett-memory-client = { path = "crates/dennett-memory-client" }
dennett-memory-core = { path = "crates/dennett-memory-core" }
dennett-runtime-antigravity = { path = "adapters/antigravity-acp" }
dennett-runtime-local = { path = "adapters/local-runtime" }
hex = "0.4"
hmac = "0.12"
proptest = "1.6"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "net", "io-util", "process", "time", "signal", "sync"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-serde_json-1"] }
uuid = { version = "1.16", features = ["v4", "serde"] }
zeroize = "1.8"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
module_name_repetitions = "allow"
