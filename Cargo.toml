[workspace]
resolver = "3"
members = [
    "crates/dennett-contracts",
    "crates/dennett-testkit",
    "services/memoryd",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.dependencies]
dennett-contracts = { path = "crates/dennett-contracts" }
proptest = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "net", "io-util", "process", "time", "signal", "sync"] }
tokio-postgres = "0.7"
uuid = { version = "1.16", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
module_name_repetitions = "allow"
