[package]
name = "dennett-desktop"
description = "Tauri 2 desktop shell and thin HTTP bridge to dennett-head (strictly isolated from Head/Memory internals)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "dennett_desktop_lib"
crate-type = ["rlib"]

[[bin]]
name = "dennett-desktop"
path = "src/main.rs"

[features]
default = []
# Embeds `apps/desktop/dist` directly into the native binary (used by `demo-d1` and release builds).
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dennett-contracts.workspace = true
dennett-head-client.workspace = true
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
thiserror.workspace = true
tokio.workspace = true
tracing = "0.1"
url = "2"

[dev-dependencies]
uuid.workspace = true

[lints]
workspace = true
